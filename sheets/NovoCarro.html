<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #26293c;
        --soft: #4a4f63;
        --line: #d5dadb;
        --turq: #36b3af;
        --bg: #f4f6f6;
        --err: #a12828;
        --ok: #1b7471;
      }
      * { box-sizing: border-box; }
      body {
        font: 15px/1.45 system-ui, -apple-system, sans-serif;
        color: var(--ink);
        margin: 0;
        padding: 18px 20px 20px;
        background: #fff;
      }
      h1 { font-size: 1.25rem; margin: 0 0 4px; }
      .sub { color: var(--soft); margin: 0 0 16px; font-size: 0.92rem; }
      .bloco {
        background: var(--bg);
        border-radius: 10px;
        padding: 14px 14px 6px;
        margin-bottom: 12px;
      }
      label {
        display: grid;
        gap: 4px;
        margin-bottom: 10px;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--soft);
      }
      input, select {
        font: inherit;
        color: var(--ink);
        font-weight: 500;
        width: 100%;
        padding: 11px 12px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }
      input:focus, select:focus {
        outline: 2px solid var(--turq);
        border-color: var(--turq);
      }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .hint { font-size: 0.85rem; color: var(--soft); margin: -2px 0 10px; font-weight: 400; }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 8px;
        padding: 14px 16px;
        cursor: pointer;
        width: 100%;
        background: var(--turq);
        color: var(--ink);
        font-size: 1.05rem;
      }
      button:disabled { opacity: 0.55; cursor: wait; }
      .msg {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.92rem;
        display: none;
      }
      .msg.ok { display: block; background: #e7f6f5; color: var(--ok); }
      .msg.err { display: block; background: #fdecec; color: var(--err); }
    </style>
  </head>
  <body>
    <h1>Novo carro</h1>
    <p class="sub">Escolhe o dono e o carro — grava na folha Carros e inicia o tempo.</p>

    <form id="form" novalidate>
      <div class="bloco">
        <label>Dono do carro *
          <select id="tel" required></select>
        </label>
        <p class="hint" id="vazio" hidden>Ainda não há clientes. Use primeiro «Novo cliente».</p>
        <label>Matrícula *<input id="mat" type="text" placeholder="AA-00-BB" required /></label>
        <div class="row">
          <label>Marca *<input id="marca" type="text" placeholder="VW" required /></label>
          <label>Modelo *<input id="modelo" type="text" placeholder="Golf" required /></label>
        </div>
        <label>Ano<input id="ano" type="number" min="1980" max="2100" placeholder="2018" /></label>
      </div>
      <button type="submit" id="btn">Guardar carro</button>
    </form>
    <div id="msg" class="msg"></div>

    <script>
      var $ = function (id) { return document.getElementById(id); };
      var msg = $('msg');
      var btn = $('btn');
      var sel = $('tel');

      function showMsg(text, ok) {
        msg.textContent = text;
        msg.className = 'msg ' + (ok ? 'ok' : 'err');
      }

      google.script.run
        .withSuccessHandler(function (data) {
          var clientes = (data && data.clientes) || [];
          sel.innerHTML = '';
          if (!clientes.length) {
            $('vazio').hidden = false;
            btn.disabled = true;
            return;
          }
          clientes.forEach(function (c) {
            var o = document.createElement('option');
            o.value = c.telemovel;
            o.textContent = c.nome + ' · ' + c.telemovel;
            sel.appendChild(o);
          });
        })
        .withFailureHandler(function (e) { showMsg(e.message || String(e), false); })
        .listarParaFormulario();

      $('form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        btn.disabled = true;
        showMsg('A guardar…', true);
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            if (!res || !res.ok) {
              showMsg((res && res.erro) || 'Erro ao guardar', false);
              return;
            }
            showMsg(res.msg || 'Guardado.', true);
            setTimeout(function () { google.script.host.close(); }, 1200);
          })
          .withFailureHandler(function (e) {
            btn.disabled = false;
            showMsg(e.message || String(e), false);
          })
          .formNovoCarro({
            telemovel: sel.value,
            matricula: $('mat').value,
            marca: $('marca').value,
            modelo: $('modelo').value,
            ano: $('ano').value,
          });
      });
    </script>
  </body>
</html>
