<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #26293c;
        --soft: #4a4f63;
        --line: #d5dadb;
        --turq: #36b3af;
        --bg: #f4f6f6;
        --err: #a12828;
        --ok: #1b7471;
      }
      * { box-sizing: border-box; }
      body {
        font: 14px/1.45 system-ui, -apple-system, sans-serif;
        color: var(--ink);
        margin: 0;
        padding: 14px;
        background: #fff;
      }
      h1 { font-size: 1.05rem; margin: 0 0 8px; }
      .note {
        font-size: 0.85rem;
        color: var(--soft);
        margin: 0 0 12px;
        padding: 8px 10px;
        background: var(--bg);
        border-radius: 6px;
      }
      .home { display: grid; gap: 8px; }
      .home button {
        text-align: left;
        padding: 12px 14px;
        background: var(--bg);
        color: var(--ink);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      .home button:hover { border-color: var(--turq); background: #e7f6f5; }
      .home button small {
        display: block;
        font-weight: 500;
        color: var(--soft);
        margin-top: 2px;
        font-size: 0.8rem;
      }
      .back {
        border: 0;
        background: none;
        color: var(--soft);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
        margin: 0 0 12px;
        width: auto;
      }
      .back:hover { color: var(--ink); }
      label {
        display: grid;
        gap: 4px;
        margin-bottom: 10px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--soft);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input, select {
        font: inherit;
        color: var(--ink);
        text-transform: none;
        letter-spacing: normal;
        font-weight: 400;
        width: 100%;
        padding: 8px 10px;
        border: 1.5px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      input:focus, select:focus {
        outline: 2px solid var(--turq);
        border-color: var(--turq);
      }
      .hint {
        font-size: 0.8rem;
        color: var(--soft);
        margin: -4px 0 10px;
        font-weight: 400;
        text-transform: none;
        letter-spacing: normal;
      }
      .panel { display: none; }
      .panel.on { display: block; }
      .btn-save {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        cursor: pointer;
        width: 100%;
        background: var(--turq);
        color: var(--ink);
        margin-top: 4px;
      }
      .btn-save:disabled { opacity: 0.55; cursor: wait; }
      .msg {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 0.9rem;
        display: none;
      }
      .msg.ok { display: block; background: #e7f6f5; color: var(--ok); }
      .msg.err { display: block; background: #fdecec; color: var(--err); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Outras entradas</h1>
    <p class="note">Cliente e carro novos: menu <strong>Pontos INOVACAR → Novo cliente / Novo carro</strong> (janela grande).</p>

    <div class="home" id="home">
      <button type="button" data-go="chegou">Carro chegou<small>Reinicia o cronómetro</small></button>
      <button type="button" data-go="pronto">Carro pronto<small>Marca feito e mostra o tempo</small></button>
      <button type="button" data-go="gasto">Gasto / serviço<small>1 € = 1 ponto</small></button>
      <button type="button" data-go="indicacao">Indicação<small>+300 pts a quem trouxe</small></button>
      <button type="button" data-go="resgate">Resgate<small>Troca um prémio</small></button>
    </div>

    <form id="form" novalidate hidden>
      <button type="button" class="back" id="voltar">← Voltar</button>

      <div class="panel" data-panel="chegou">
        <label>Carro *<select id="h_mat"></select></label>
        <p class="hint">Reinicia a entrada: tempo a contar desde agora.</p>
      </div>

      <div class="panel" data-panel="pronto">
        <label>Carro em trabalho *<select id="p_mat"></select></label>
        <p class="hint">Marca feito e mostra quanto demorou.</p>
      </div>

      <div class="panel" data-panel="gasto">
        <label>Cliente *<select id="g_tel"></select></label>
        <label>Carro<select id="g_mat"><option value="">— sem matrícula —</option></select></label>
        <label>Valor (€) *<input id="g_valor" type="number" min="0" step="0.01" /></label>
        <label>Nota<input id="g_nota" type="text" placeholder="revisão, travões…" /></label>
      </div>

      <div class="panel" data-panel="indicacao">
        <label>Quem indicou *<select id="i_quem"></select></label>
        <label>Novo telemóvel *<input id="i_novo_tel" type="tel" placeholder="934…" /></label>
        <label>Nome do novo<input id="i_novo_nome" type="text" placeholder="Bruno Martins" /></label>
        <p class="hint">Só depois do 1.º serviço do novo.</p>
      </div>

      <div class="panel" data-panel="resgate">
        <label>Cliente *<select id="r_tel"></select></label>
        <label>Prémio *<select id="r_premio"></select></label>
        <label>Carro<select id="r_mat"><option value="">— sem matrícula —</option></select></label>
      </div>

      <button class="btn-save" type="submit" id="btn">Guardar</button>
    </form>

    <div id="msg" class="msg"></div>

    <script>
      var $ = function (id) { return document.getElementById(id); };
      var home = $('home');
      var form = $('form');
      var panels = document.querySelectorAll('.panel');
      var msg = $('msg');
      var btn = $('btn');
      var accaoActual = '';

      function showMsg(text, ok) {
        msg.textContent = text;
        msg.className = 'msg ' + (ok ? 'ok' : 'err');
      }

      function irHome() {
        accaoActual = '';
        home.hidden = false;
        form.hidden = true;
        msg.className = 'msg';
      }

      function irAccao(a) {
        accaoActual = a;
        home.hidden = true;
        form.hidden = false;
        panels.forEach(function (p) {
          p.classList.toggle('on', p.getAttribute('data-panel') === a);
        });
        msg.className = 'msg';
        actualizarCarros();
      }

      function fillSelect(sel, items, mapFn, emptyLabel) {
        var cur = sel.value;
        sel.innerHTML = '';
        if (emptyLabel != null) {
          var o0 = document.createElement('option');
          o0.value = '';
          o0.textContent = emptyLabel;
          sel.appendChild(o0);
        }
        items.forEach(function (it) {
          var m = mapFn(it);
          var o = document.createElement('option');
          o.value = m.value;
          o.textContent = m.label;
          sel.appendChild(o);
        });
        if (cur) sel.value = cur;
      }

      function labelCliente(c) { return c.nome + ' · ' + c.telemovel; }
      function labelCarro(c) {
        return c.matricula + (c.modelo ? ' · ' + c.marca + ' ' + c.modelo : '');
      }

      function carregarListas() {
        google.script.run
          .withSuccessHandler(function (data) {
            var clientes = data.clientes || [];
            fillSelect($('g_tel'), clientes, function (c) { return { value: c.telemovel, label: labelCliente(c) }; });
            fillSelect($('i_quem'), clientes, function (c) { return { value: c.telemovel, label: labelCliente(c) }; });
            fillSelect($('r_tel'), clientes, function (c) { return { value: c.telemovel, label: labelCliente(c) }; });
            fillSelect($('r_premio'), data.premios || [], function (p) {
              return { value: p.id, label: p.nome + ' (' + p.pontos + ' pts)' };
            });
            fillSelect($('h_mat'), data.carros || [], function (c) {
              return { value: c.matricula, label: labelCarro(c) };
            }, '— escolher —');
            fillSelect($('p_mat'), data.carrosEmTrabalho || [], function (c) {
              return {
                value: c.matricula,
                label: labelCarro(c) + (c.entrada_em ? ' · desde ' + c.entrada_em : ''),
              };
            }, '— escolher —');
            actualizarCarros();
          })
          .withFailureHandler(function (e) { showMsg(e.message || String(e), false); })
          .listarParaFormulario();
      }

      function actualizarCarros() {
        var tel = '';
        var matSel = null;
        if (accaoActual === 'gasto') { tel = $('g_tel').value; matSel = $('g_mat'); }
        else if (accaoActual === 'resgate') { tel = $('r_tel').value; matSel = $('r_mat'); }
        if (!matSel) return;
        google.script.run
          .withSuccessHandler(function (carros) {
            fillSelect(matSel, carros || [], function (c) {
              return { value: c.matricula, label: labelCarro(c) };
            }, '— sem matrícula —');
          })
          .carrosDoCliente(tel);
      }

      home.querySelectorAll('[data-go]').forEach(function (b) {
        b.addEventListener('click', function () { irAccao(b.getAttribute('data-go')); });
      });
      $('voltar').addEventListener('click', irHome);
      $('g_tel').addEventListener('change', actualizarCarros);
      $('r_tel').addEventListener('change', actualizarCarros);

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        btn.disabled = true;
        showMsg('A guardar…', true);
        var a = accaoActual;
        var fn = '';
        var payload = {};
        if (a === 'chegou') {
          fn = 'formCarroChegou';
          payload = { matricula: $('h_mat').value };
        } else if (a === 'pronto') {
          fn = 'formCarroPronto';
          payload = { matricula: $('p_mat').value };
        } else if (a === 'gasto') {
          fn = 'formGasto';
          payload = {
            telemovel: $('g_tel').value,
            matricula: $('g_mat').value,
            valorEur: $('g_valor').value,
            nota: $('g_nota').value,
          };
        } else if (a === 'indicacao') {
          fn = 'formIndicacao';
          payload = {
            quemIndicou: $('i_quem').value,
            novoTelemovel: $('i_novo_tel').value,
            novoNome: $('i_novo_nome').value,
          };
        } else if (a === 'resgate') {
          fn = 'formResgate';
          payload = {
            telemovel: $('r_tel').value,
            premioId: $('r_premio').value,
            matricula: $('r_mat').value,
          };
        }

        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            if (!res || !res.ok) {
              showMsg((res && res.erro) || 'Erro ao guardar', false);
              return;
            }
            showMsg(res.msg || 'Guardado.', true);
            form.reset();
            carregarListas();
            setTimeout(irHome, 900);
          })
          .withFailureHandler(function (e) {
            btn.disabled = false;
            showMsg(e.message || String(e), false);
          })[fn](payload);
      });

      carregarListas();
    </script>
  </body>
</html>
