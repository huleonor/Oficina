<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#26293c">
  <title>INOVACAR Tempos</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preload" href="fonts/figtree-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topo">
    <div class="topo-dentro">
      <a class="marca" href="./" aria-label="INOVACAR Tempos">
        <img src="../images/logo-inovacar-240.png" srcset="../images/logo-inovacar-240.png 1x, ../images/logo-inovacar-480.png 2x" width="92" height="56" alt="INOVACAR Oficina Automóvel">
        <span class="marca-nome">Tempos</span>
      </a>
      <div class="topo-acoes">
        <span class="sync" data-sync aria-live="polite"></span>
        <button class="btn-icone no-escuro" type="button" data-abrir-ligacao aria-label="Ligação à sheet" title="Ligação à sheet"><span data-icone="gear"></span></button>
      </div>
    </div>
  </header>

  <div class="aviso" data-aviso role="status" hidden></div>

  <main id="conteudo" data-conteudo></main>

  <dialog class="painel" data-painel aria-labelledby="painel-titulo"></dialog>

  <div class="toast" role="status" aria-live="polite" data-toast hidden></div>

  <script src="config.js"></script>
  <script src="icones.js"></script>
  <script src="app.js"></script>
</body>
</html>
